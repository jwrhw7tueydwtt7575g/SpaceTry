name: python
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU-only torch first)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install gymnasium==1.3.0 stable-baselines3==2.9.0 numpy==1.26.4 matplotlib pytest pillow
          pip install pyyaml optuna opencv-python-headless
          pip install -e .
      - name: MVP test suite
        run: python -m pytest spaceforge_mvp/tests -q
      - name: ROS package offline suites (dependency-optional, skip live tests)
        run: |
          export PYTHONPATH="$PWD:$PWD/ros2_ws/src/spaceforge_rl_env:$PWD/ros2_ws/src/spaceforge_mission_ctrl:$PWD/ros2_ws/src/spaceforge_llm_planner:$PWD/ros2_ws/src/spaceforge_perception:$PWD/ros2_ws/src/spaceforge_auto_trainer:$PWD/ros2_ws/src/spaceforge_rl_trainer:$PWD/ros2_ws/src/spaceforge_observability:$PYTHONPATH"
          python -m pytest ros2_ws/src/spaceforge_rl_env/test ros2_ws/src/spaceforge_mission_ctrl/test ros2_ws/src/spaceforge_llm_planner/test ros2_ws/src/spaceforge_perception/test ros2_ws/src/spaceforge_auto_trainer/test ros2_ws/src/spaceforge_rl_trainer/test ros2_ws/src/spaceforge_observability/test -q
      - name: Validation matrix smoke (2 episodes, offline probes)
        run: |
          export PYTHONPATH="$PWD:$PWD/ros2_ws/src/spaceforge_rl_env:$PWD/ros2_ws/src/spaceforge_mission_ctrl:$PWD/ros2_ws/src/spaceforge_llm_planner:$PWD/ros2_ws/src/spaceforge_auto_trainer:$PWD/ros2_ws/src/spaceforge_perception:$PYTHONPATH"
          python -m spaceforge_mvp.eval.validation_matrix --episodes 2 --levels nominal
