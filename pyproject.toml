[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spaceforge-mvp"
version = "0.1.0"
description = "Autonomous Spacecraft Rendezvous & Docking Reinforcement Learning MVP"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "numpy==1.26.4",
    "gymnasium==1.3.0",
    "stable-baselines3==2.9.0",
    "pytest==8.3.4",
    "matplotlib==3.6.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["spaceforge_mvp*"]

[tool.pytest.ini_options]
# Scope to the pure-Python MVP suite. ros2_ws/ needs rclpy + Gazebo and
# must be run separately (colcon pytest), otherwise root `pytest` errors
# on collection even though the MVP is healthy.
testpaths = ["spaceforge_mvp/tests"]
